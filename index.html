<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Time Matcher</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .touch-manipulation {
            touch-action: manipulation;
        }
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col" x-data="timeMatcherApp()" x-init="initApp()">

    <!-- Top Navigation Header -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
            <!-- App Logo & Title -->
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200 shrink-0">
                    <i class="fa-solid font-bold fa-calendar-check text-lg sm:text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base sm:text-lg text-slate-900 tracking-tight leading-none">夾時間啦喂</h1>
                </div>
            </div>

            <!-- Google Auth Status / User Profile Menu -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <template x-if="!isLoggedIn">
                    <button @click="loginWithGoogle()" class="flex items-center space-x-1.5 sm:space-x-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold px-3 py-2 sm:px-4 sm:py-2 rounded-xl transition shadow-xs">
                        <i class="fa-brands fa-google text-xs sm:text-sm"></i>
                        <span class="text-xs">Google 登入</span>
                    </button>
                </template>

                <template x-if="isLoggedIn">
                    <div class="relative" x-data="{ openProfile: false }">
                        <button @click="openProfile = !openProfile" class="flex items-center space-x-1.5 sm:space-x-2 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 p-1 sm:p-1.5 pr-2.5 sm:pr-3 rounded-full transition touch-manipulation">
                            <img :src="currentUser.avatar" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border-2 border-white shadow-2xs object-cover" :alt="currentUser.name">
                            <div class="text-left hidden sm:block">
                                <div class="text-xs font-bold text-slate-800 flex items-center space-x-1">
                                    <span x-text="currentUser.name"></span>
                                    <template x-if="isAdmin">
                                        <span class="text-[9px] bg-amber-100 text-amber-800 font-extrabold px-1.5 py-0.2 rounded border border-amber-200">👑 管理員</span>
                                    </template>
                                </div>
                                <div class="text-[10px] text-emerald-600 font-semibold">● Google 已登入</div>
                            </div>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] sm:text-xs ml-0.5"></i>
                        </button>

                        <div x-show="openProfile" @click.outside="openProfile = false" x-cloak 
                             class="absolute right-0 mt-2 w-60 sm:w-64 bg-white rounded-2xl shadow-xl border border-slate-100 p-3 z-50">
                            <div class="flex items-center space-x-2.5 p-2 bg-slate-50 rounded-xl mb-2">
                                <img :src="currentUser.avatar" class="w-9 h-9 rounded-full object-cover">
                                <div class="overflow-hidden">
                                    <div class="text-xs sm:text-sm font-bold text-slate-800 truncate flex items-center space-x-1">
                                        <span x-text="currentUser.name"></span>
                                        <template x-if="isAdmin">
                                            <span class="text-[9px] bg-amber-100 text-amber-800 font-bold px-1 rounded">👑</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-slate-500 truncate" x-text="currentUser.email"></div>
                                </div>
                            </div>
                            
                            <div class="space-y-1 mb-2 border-b border-slate-100 pb-2">
                                <button @click="openSettingsModal = true; openProfile = false" class="w-full text-left text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 p-2 rounded-xl transition flex items-center space-x-2">
                                    <i class="fa-solid fa-user-pen text-indigo-500"></i>
                                    <span>修改個人顯示暱稱</span>
                                </button>
                                
                                <template x-if="isAdmin">
                                    <button @click="openWhitelistModal = true; openProfile = false" class="w-full text-left text-xs font-semibold text-slate-700 hover:bg-amber-50 hover:text-amber-700 p-2 rounded-xl transition flex items-center space-x-2">
                                        <i class="fa-solid fa-crown text-amber-500"></i>
                                        <span>管理 5 位白名單成員 (管理員)</span>
                                    </button>
                                </template>
                                <template x-if="!isAdmin">
                                    <div class="w-full text-left text-[11px] font-medium text-slate-400 p-2 rounded-xl flex items-center space-x-2 bg-slate-50">
                                        <i class="fa-solid fa-lock text-slate-400"></i>
                                        <span>白名單由管理員 (<span x-text="adminEmail" class="font-mono"></span>) 管理</span>
                                    </div>
                                </template>
                            </div>

                            <button @click="logout(); openProfile = false" class="w-full text-left text-xs font-semibold text-red-500 hover:bg-red-50 p-2 rounded-xl transition flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                <span>登出帳號</span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-2.5 sm:px-6 lg:px-8 py-3 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
        
        <!-- Left Column: Calendar & Controls -->
        <section class="lg:col-span-8 flex flex-col space-y-3 sm:space-y-4">
            
            <!-- 🗓️ Confirmed Events List Banner (多次/多天/暫定 聚會清單) -->
            <template x-if="confirmedEventsList.length > 0">
                <div class="bg-gradient-to-r from-amber-500 via-indigo-600 to-violet-600 text-white rounded-2xl p-3.5 sm:p-4 shadow-lg flex flex-col space-y-2 border border-amber-200/30">
                    <div class="flex items-center justify-between border-b border-white/20 pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-xl sm:text-2xl shrink-0">🗓️</span>
                            <div class="text-xs sm:text-sm font-black tracking-tight">
                                敲定與預定活動列表 (<span x-text="confirmedEventsList.length"></span> 個活動)
                            </div>
                        </div>
                        <span class="bg-amber-400 text-slate-900 text-[9px] sm:text-[10px] px-2 py-0.5 rounded-full font-black">夾時間模式</span>
                    </div>

                    <div class="space-y-2 max-h-36 overflow-y-auto custom-scrollbar pr-1">
                        <template x-for="event in confirmedEventsList" :key="event.id || event.dateKey">
                            <div class="flex items-center justify-between bg-white/10 hover:bg-white/20 p-2 rounded-xl transition text-xs">
                                <div class="flex items-center space-x-1.5 truncate">
                                    <!-- 狀態 Badge -->
                                    <span :class="event.status === 'confirmed' ? 'bg-emerald-400 text-slate-900' : 'bg-amber-300 text-slate-900'"
                                          class="text-[9px] font-black px-1.5 py-0.2 rounded-md shrink-0"
                                          x-text="event.status === 'confirmed' ? '正式' : '⏳ 暫定'"></span>

                                    <!-- 日期標示 [ 11月13日 - 11月17日 ] -->
                                    <span class="font-bold underline decoration-amber-300 underline-offset-2 shrink-0" 
                                          x-text="formatEventDateRange(event)"></span>

                                    <!-- 活動名稱與圖標 -->
                                    <span class="truncate font-semibold">
                                        <span x-text="(event.isMultiDay ? '✈️ ' : '🗓️ ') + event.title"></span>
                                    </span>
                                </div>
                                <template x-if="isAdmin">
                                    <button @click="clearConfirmedEvent(event.id || event.dateKey)" title="取消此聚會" class="text-[10px] bg-black/20 hover:bg-red-600/80 active:scale-95 text-white px-2 py-1 rounded-lg transition font-bold shrink-0 touch-manipulation border border-white/20 ml-2">
                                        取消
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- 🔍 Member Focus Mode Active Banner -->
            <template x-if="focusedUserId">
                <div class="bg-indigo-600 text-white rounded-2xl px-4 py-2.5 shadow-md flex items-center justify-between animate-fade-in">
                    <div class="flex items-center space-x-2 text-xs font-bold">
                        <i class="fa-solid fa-crosshairs text-amber-300"></i>
                        <span>正在專注查看成員時間：</span>
                        <span class="bg-white/20 px-2 py-0.5 rounded-lg text-amber-200 font-black" x-text="getFocusedMemberName()"></span>
                    </div>
                    <button @click="focusedUserId = null" class="text-xs bg-white/20 hover:bg-white/30 text-white font-bold px-2.5 py-1 rounded-xl transition touch-manipulation">
                        <i class="fa-solid fa-xmark mr-1"></i>重置全組視角
                    </button>
                </div>
            </template>

            <!-- Calendar Navigation & Presets Card -->
            <div class="bg-white rounded-2xl p-3.5 sm:p-5 border border-slate-200/80 shadow-xs flex flex-col space-y-3">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-4">
                    <div class="flex items-center justify-between sm:block">
                        <div>
                            <!-- 🗓️ 年份與月份下拉選單 -->
                            <div class="flex items-center space-x-1.5 mb-1">
                                <select x-model.number="currentYear" class="bg-slate-100 hover:bg-slate-200 text-slate-900 text-sm sm:text-base font-extrabold px-2 py-1 rounded-xl border border-slate-200 cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                    <template x-for="y in yearOptions" :key="y">
                                        <option :value="y" x-text="y + ' 年'"></option>
                                    </template>
                                </select>
                                
                                <select x-model.number="currentMonth" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm sm:text-base font-extrabold px-2 py-1 rounded-xl border border-indigo-200 cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                    <template x-for="(mName, idx) in monthNames" :key="idx">
                                        <option :value="idx" x-text="mName"></option>
                                    </template>
                                </select>
                                
                                <span class="text-[10px] sm:text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full border border-indigo-100 font-bold" x-text="members.length + ' 位成員'"></span>
                            </div>
                            <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5">點擊切換：<span class="text-emerald-600 font-bold">🟢 有空</span> ➔ <span class="text-amber-600 font-bold">🟡 待定</span> ➔ <span class="text-rose-600 font-bold">🔴 沒空</span> ➔ <span class="text-slate-400">⚪ 取消</span></p>
                        </div>

                        <!-- Status legend bar -->
                        <div class="flex items-center space-x-1.5 bg-slate-50 p-1.5 rounded-lg border border-slate-100 text-[10px] sm:text-xs">
                            <span class="flex items-center space-x-1 text-emerald-700 font-bold">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span>有空</span>
                            </span>
                            <span class="text-slate-300">|</span>
                            <span class="flex items-center space-x-1 text-amber-700 font-bold">
                                <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                                <span>待定</span>
                            </span>
                            <span class="text-slate-300">|</span>
                            <span class="flex items-center space-x-1 text-rose-700 font-bold">
                                <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                                <span>沒空</span>
                            </span>
                        </div>
                    </div>

                    <div class="flex items-center justify-end space-x-2">
                        <button @click="prevMonth()" class="p-2 sm:p-2.5 active:bg-slate-200 hover:bg-slate-100 rounded-xl text-slate-600 transition border border-slate-200 touch-manipulation">
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <button @click="currentMonth = new Date().getMonth(); currentYear = new Date().getFullYear();" class="px-3 py-1.5 sm:py-2 active:bg-slate-200 hover:bg-slate-100 rounded-xl text-xs font-bold text-slate-700 transition border border-slate-200 touch-manipulation">
                            今天
                        </button>
                        <button @click="nextMonth()" class="p-2 sm:p-2.5 active:bg-slate-200 hover:bg-slate-100 rounded-xl text-slate-600 transition border border-slate-200 touch-manipulation">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- 🌟 Member Avatar Quick Legend & Focus Bar -->
                <div class="pt-2 sm:pt-3 border-t border-slate-100 flex items-center space-x-1.5 overflow-x-auto custom-scrollbar pb-1 text-xs -mx-1 px-1">
                    <span class="text-slate-400 font-bold text-[10px] sm:text-[11px] whitespace-nowrap flex items-center space-x-1 shrink-0">
                        <i class="fa-solid fa-users text-indigo-500"></i>
                        <span>成員對照 (點擊高亮)：</span>
                    </span>
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <template x-for="member in members" :key="member.id">
                            <button @click="toggleUserFocus(member.id)" 
                                    :class="{
                                        'bg-indigo-600 text-white border-indigo-600 ring-2 ring-indigo-300': focusedUserId === member.id,
                                        'bg-slate-50 hover:bg-indigo-50 text-slate-700 border-slate-200/80': focusedUserId !== member.id
                                    }"
                                    class="flex items-center space-x-1 px-2 py-0.5 sm:py-1 rounded-full border transition whitespace-nowrap touch-manipulation">
                                <img :src="member.avatar" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full border border-white object-cover">
                                <span x-text="member.name" class="font-bold text-[10px] sm:text-[11px]"></span>
                                <template x-if="currentUser && currentUser.id === member.id">
                                    <span class="text-[8px] sm:text-[9px] bg-indigo-100 text-indigo-700 px-1 rounded font-extrabold" :class="focusedUserId === member.id ? 'bg-white/20 text-white' : ''">你</span>
                                </template>
                            </button>
                        </template>
                        <template x-if="members.length === 0">
                            <span class="text-[10px] sm:text-[11px] text-slate-400 italic">登入後將在此顯示團隊成員對照</span>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Calendar Grid Container -->
            <div class="bg-white rounded-2xl p-2.5 sm:p-5 border border-slate-200/80 shadow-xs flex-1 flex flex-col relative no-select">
                
                <template x-if="!isLoggedIn">
                    <div class="absolute inset-0 bg-white/85 backdrop-blur-[2px] z-20 rounded-2xl flex flex-col items-center justify-center p-4 sm:p-6 text-center">
                        <div class="w-10 h-10 sm:w-12 sm:h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-lg sm:text-xl mb-2 sm:mb-3 shadow-md">
                            <i class="fa-brands fa-google"></i>
                        </div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-900 mb-1">請先登入 Google 帳號</h3>
                        <p class="text-[11px] sm:text-xs text-slate-500 mb-3 sm:mb-4 max-w-xs">登入後即可在月曆上標記時間，與朋友實時夾時間！</p>
                        <button @click="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl transition shadow-md flex items-center space-x-2 touch-manipulation">
                            <i class="fa-brands fa-google text-xs"></i>
                            <span>立即使用 Google 登入</span>
                        </button>
                    </div>
                </template>

                <!-- Day Names Header (Sunday with Highlighted Red Color) -->
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] sm:text-xs font-extrabold mb-1.5 sm:mb-2">
                    <div class="text-rose-600 bg-rose-50/60 py-1 rounded-lg">日</div>
                    <div class="text-slate-500 py-1">一</div>
                    <div class="text-slate-500 py-1">二</div>
                    <div class="text-slate-500 py-1">三</div>
                    <div class="text-slate-500 py-1">四</div>
                    <div class="text-slate-500 py-1">五</div>
                    <div class="text-indigo-600 bg-indigo-50/50 py-1 rounded-lg">六</div>
                </div>

                <!-- Calendar Days Grid -->
                <div class="grid grid-cols-7 gap-1 sm:gap-2 flex-1 auto-rows-fr">
                    <template x-for="(dayObj, index) in calendarDays" :key="index">
                        <div 
                            x-data="{ hovered: false }"
                            @mouseenter="hovered = true"
                            @mouseleave="hovered = false"
                            @touchstart="hovered = true"
                            @touchend.debounce.1500ms="hovered = false"
                            :class="{
                                'bg-slate-50/40 border-transparent text-slate-300 pointer-events-none': !dayObj.inCurrentMonth,
                                'bg-purple-50/60 border-purple-200': dayObj.inCurrentMonth && isMultiDayEventDate(dayObj.dateKey),
                                'border-slate-200 hover:border-indigo-400 active:scale-97 bg-white': dayObj.inCurrentMonth && !isMultiDayEventDate(dayObj.dateKey) && !dayObj.isSunday && !dayObj.holidayName && !dayObj.customEventName,
                                'border-purple-300 bg-purple-50/70 hover:border-purple-400': dayObj.inCurrentMonth && !isMultiDayEventDate(dayObj.dateKey) && dayObj.customEventName,
                                'border-rose-200 bg-rose-50/30 hover:border-rose-400': dayObj.inCurrentMonth && !isMultiDayEventDate(dayObj.dateKey) && !dayObj.customEventName && (dayObj.isSunday || dayObj.holidayName),
                                'ring-2 ring-indigo-600 ring-offset-1': dayObj.isToday && dayObj.inCurrentMonth,
                                'ring-2 ring-amber-400 bg-amber-50/30': getConfirmedEventForDate(dayObj.dateKey) && !isMultiDayEventDate(dayObj.dateKey) && dayObj.inCurrentMonth,
                                'opacity-30 bg-slate-100/50': focusedUserId && dayObj.inCurrentMonth && !getUserStatus(dayObj.dateKey, focusedUserId),
                                'ring-2 ring-emerald-500 bg-emerald-50/20': focusedUserId && dayObj.inCurrentMonth && getUserStatus(dayObj.dateKey, focusedUserId) === 'free',
                                'ring-2 ring-amber-500 bg-amber-50/20': focusedUserId && dayObj.inCurrentMonth && getUserStatus(dayObj.dateKey, focusedUserId) === 'maybe',
                                'ring-2 ring-rose-500 bg-rose-50/20': focusedUserId && dayObj.inCurrentMonth && getUserStatus(dayObj.dateKey, focusedUserId) === 'busy'
                            }"
                            class="relative min-h-[70px] xs:min-h-[78px] sm:min-h-[105px] border rounded-xl sm:rounded-2xl p-1 sm:p-1.5 flex flex-col justify-between transition-all duration-100 cursor-pointer group shadow-2xs hover:shadow-md touch-manipulation"
                            @click="dayObj.inCurrentMonth && toggleAvailability(dayObj.dateKey)">
                            
                            <!-- Top Date Bar -->
                            <div class="flex items-start justify-between leading-none">
                                <div class="flex flex-col">
                                    <span 
                                        :class="{
                                            'font-extrabold text-indigo-600': dayObj.isToday,
                                            'text-purple-700 font-extrabold': dayObj.inCurrentMonth && dayObj.customEventName,
                                            'text-rose-600 font-extrabold': dayObj.inCurrentMonth && !dayObj.customEventName && (dayObj.isSunday || dayObj.holidayName),
                                            'text-slate-800 font-bold': dayObj.inCurrentMonth && !dayObj.isSunday && !dayObj.holidayName && !dayObj.customEventName,
                                            'text-slate-300': !dayObj.inCurrentMonth
                                        }"
                                        class="text-[11px] xs:text-xs sm:text-sm" x-text="dayObj.dayNum">
                                    </span>
                                    
                                    <!-- 🎂 自訂活動 / 生日標籤 (紫色高亮) -->
                                    <template x-if="dayObj.inCurrentMonth && dayObj.customEventName">
                                        <span class="text-[8px] xs:text-[9px] text-purple-700 bg-purple-100 font-black truncate max-w-[48px] xs:max-w-[65px] sm:max-w-[85px] leading-tight mt-0.5 px-1 rounded" x-text="dayObj.customEventName"></span>
                                    </template>

                                    <!-- 🇭🇰 香港公眾假期標籤 (紅色高亮) -->
                                    <template x-if="dayObj.inCurrentMonth && !dayObj.customEventName && dayObj.holidayName">
                                        <span class="text-[8px] xs:text-[9px] text-rose-600 font-black truncate max-w-[48px] xs:max-w-[65px] sm:max-w-[85px] leading-tight mt-0.5" x-text="dayObj.holidayName"></span>
                                    </template>
                                    
                                    <!-- 🌙 Eve of Holiday Tag -->
                                    <template x-if="dayObj.inCurrentMonth && !dayObj.holidayName && !dayObj.customEventName && dayObj.isEveHoliday">
                                        <span class="text-[8px] xs:text-[9px] text-amber-600 font-bold truncate max-w-[48px] xs:max-w-[65px] sm:max-w-[85px] leading-tight mt-0.5">🌙 假期前夕</span>
                                    </template>
                                </div>

                                <!-- User Status Badge (🟢 有空 / 🟡 待定 / 🔴 沒空) -->
                                <template x-if="dayObj.inCurrentMonth && isLoggedIn">
                                    <div>
                                        <span x-show="getUserStatus(dayObj.dateKey, currentUser.id) === 'free'" class="text-[9px] bg-emerald-100 text-emerald-800 px-1 py-0.2 rounded font-black">
                                            🟢<span class="hidden sm:inline ml-0.5">有空</span>
                                        </span>

    <!-- Application Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteField, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCFFQ6v_X2O5oOco3DtXRHQyRYPbNpWPXE",
            authDomain: "fdmeet.firebaseapp.com",
            projectId: "fdmeet",

            messagingSenderId: "818872276812",

        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'friends-time-sync';
        let app, auth, db;
        let isFirebaseConfigured = false;

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isFirebaseConfigured = true;
            }
        } catch (e) {
            console.warn("Firebase 初始化提示：未接駁真實 API Key", e);
        }

        // 🇭🇰 Hong Kong Public Holidays Dictionary (2025, 2026, 2027)
        const hkHolidays = {
            "2025-01-01": "元旦", "2025-01-29": "農曆年初一", "2025-01-30": "農曆年初二", "2025-01-31": "農曆年初三",
            "2025-04-18": "耶穌受難節", "2025-04-19": "受難節翌日", "2025-04-21": "復活節星期一", "2025-04-04": "清明節",
            "2025-05-01": "勞動節", "2025-05-05": "佛誕", "2025-05-31": "端午節", "2025-07-01": "特區成立日",
            "2025-10-01": "國慶日", "2025-10-07": "中秋節翌日", "2025-10-29": "重陽節", "2025-12-25": "聖誕節", "2025-12-26": "聖誕節翌日",
            "2026-01-01": "元旦", "2026-02-17": "農曆年初一", "2026-02-18": "農曆年初二", "2026-02-19": "農曆年初三",
            "2026-04-03": "耶穌受難節", "2026-04-04": "受難節翌日", "2026-04-06": "清明節翌日", "2026-04-07": "復活節翌日",
            "2026-05-01": "勞動節", "2026-05-25": "佛誕翌日", "2026-06-19": "端午節", "2026-07-01": "特區成立日",
            "2026-09-26": "中秋節翌日", "2026-10-01": "國慶日", "2026-10-19": "重陽節翌日", "2026-12-25": "聖誕節", "2026-12-26": "聖誕節翌日",
            "2027-01-01": "元旦", "2027-02-06": "農曆年初一", "2027-02-08": "農曆年初三", "2027-02-09": "年初二補假",
            "2027-03-26": "耶穌受難節", "2027-03-27": "受難節翌日", "2027-03-29": "復活節星期一", "2027-04-05": "清明節",
            "2027-05-01": "勞動節", "2027-05-13": "佛誕", "2027-06-09": "端午節", "2027-07-01": "特區成立日",
            "2027-09-16": "中秋節翌日", "2027-10-01": "國慶日", "2027-10-08": "重陽節", "2027-12-25": "聖誕節", "2027-12-27": "聖誕節補假"
        };

        // 🎂 💜 個人 / 自訂特別日子 Dictionary (紫色高亮專用)
        const customEvents = {
            "2026-04-20": "🎂 彤彤 生日",
            "2026-05-23": "🎂 Christy 生日",
            "2026-09-13": "🎂 Candice生日",
            "2026-11-11": "🎂 Carmen 生日",
            "2026-11-13": "👑 Big Bang 演唱會",
            "2027-04-20": "🎂 彤彤 生日",
            "2027-05-23": "🎂 Christy 生日",
            "2027-09-13": "🎂 Candice生日",
            "2027-11-11": "🎂 Carmen 生日",
            "2028-04-20": "🎂 彤彤 生日",
            "2028-05-23": "🎂 Christy 生日",
            "2028-09-13": "🎂 Candice生日",
            "2028-11-11": "🎂 Carmen 生日"
        };

        function createTimeMatcherApp() {
            return {
                isFirebaseActive: isFirebaseConfigured,
                isLoggedIn: false,
                currentUser: null,
                members: [],
                
                currentMonth: new Date().getMonth(),
                currentYear: new Date().getFullYear(),
                
                availabilityMap: {},
                confirmedEvents: {},
                focusedUserId: null, // 🔍 Member Focus Mode ID
                bestMatchMode: 'all', // 🎛️ 預設顯示 [全部]

                showEventModal: false,
                openSettingsModal: false,
                openWhitelistModal: false,
                tempDisplayName: '',
                selectedDateKey: '',
                eventTitle: '週末燒烤',
                eventIsMultiDay: false,
                eventEndDate: '',
                eventStatus: 'confirmed',
                toast: { visible: false, message: '' },

                adminEmail: '',
                enableWhitelist: true,
                allowedEmails: ['', '', '', '', ''],

                get isAdmin() {
                    if (!this.currentUser || !this.currentUser.email) return false;
                    if (!this.adminEmail) return true;
                    return this.currentUser.email.toLowerCase() === this.adminEmail.toLowerCase();
                },

                get confirmedEventsList() {
                    const list = Object.values(this.confirmedEvents || {}).filter(e => e && (e.dateKey || e.startDate));
                    return list.sort((a, b) => {
                        const startA = a.startDate || a.dateKey;
                        const startB = b.startDate || b.dateKey;
                        return startA.localeCompare(startB);
                    });
                },

                // 取得特定日期的聚會（包含單日與多天範圍檢測）
                getConfirmedEventForDate(dateKey) {
                    if (!dateKey) return null;
                    if (this.confirmedEvents[dateKey]) return this.confirmedEvents[dateKey];
                    return Object.values(this.confirmedEvents).find(e => e && e.startDate && e.endDate && dateKey >= e.startDate && dateKey <= e.endDate) || null;
                },

                // 判斷日期是否落入多天旅行範圍內
                isMultiDayEventDate(dateKey) {
                    if (!dateKey) return false;
                    return Object.values(this.confirmedEvents).some(e => {
                        if (e && e.isMultiDay && e.startDate && e.endDate) {
                            return dateKey >= e.startDate && dateKey <= e.endDate;
                        }
                        return false;
                    });
                },

                // 取得多天旅行在該日期的標示文字
                getMultiDayEventInfo(dateKey) {
                    if (!dateKey) return null;
                    for (const e of Object.values(this.confirmedEvents)) {
                        if (e && e.isMultiDay && e.startDate && e.endDate) {
                            if (dateKey >= e.startDate && dateKey <= e.endDate) {
                                if (dateKey === e.startDate) {
                                    return `${e.title} (Day 1)`;
                                }
                                return e.title;
                            }
                        }
                    }
                    return null;
                },

                formatEventDateRange(event) {
                    const start = event.startDate || event.dateKey;
                    const end = event.endDate || start;
                    if (!event.isMultiDay || start === end) {
                        return this.formatDateTitle(start);
                    }
                    const partsStart = start.split('-');
                    const partsEnd = end.split('-');
                    return `${partsStart[1]}月${partsStart[2]}日 - ${partsEnd[1]}月${partsEnd[2]}日`;
                },

                initApp() {
                    if (this.isFirebaseActive && auth && db) {
                        this.setupFirebaseListeners();
                    }
                },

                setupFirebaseListeners() {
                    const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                    
                    // 1. Listen to Whitelist & Admin Settings
                    onSnapshot(configRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            this.adminEmail = data.adminEmail || '';
                            this.enableWhitelist = data.enableWhitelist !== undefined ? data.enableWhitelist : true;
                            this.allowedEmails = data.allowedEmails || ['', '', '', '', ''];
                        }
                    });

                    // 2. Listen to Confirmed Events Map
                    const eventRef = doc(db, 'artifacts', appId, 'public', 'data', 'events', 'confirmed');
                    onSnapshot(eventRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.eventsMap) {
                                this.confirmedEvents = data.eventsMap;
                            } else if (data.dateKey) {
                                this.confirmedEvents = { [data.dateKey]: data };
                            } else {
                                this.confirmedEvents = {};
                            }
                        } else {
                            this.confirmedEvents = {};
                        }
                    });

                    // 3. Auth Listener
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            const userEmail = (user.email || '').toLowerCase();

                            const configSnap = await getDoc(configRef);
                            if (!configSnap.exists()) {
                                this.adminEmail = userEmail;
                                await setDoc(configRef, {
                                    adminEmail: userEmail,
                                    enableWhitelist: true,
                                    allowedEmails: [userEmail, '', '', '', '']
                                });
                            } else {
                                const cloudData = configSnap.data();
                                this.adminEmail = cloudData.adminEmail || userEmail;
                                this.enableWhitelist = cloudData.enableWhitelist !== undefined ? cloudData.enableWhitelist : true;
                                this.allowedEmails = cloudData.allowedEmails || [userEmail, '', '', '', ''];
                            }

                            if (this.enableWhitelist) {
                                const cleanAllowed = this.allowedEmails.map(e => e.trim().toLowerCase()).filter(e => e !== '');
                                const isAllowed = cleanAllowed.length === 0 || cleanAllowed.includes(userEmail);
                                
                                if (!isAllowed) {
                                    this.showToast(`⛔ 存取拒絕：${userEmail} 非授權成員`);
                                    await signOut(auth);
                                    this.isLoggedIn = false;
                                    this.currentUser = null;
                                    return;
                                }
                            }

                            this.isLoggedIn = true;
                            
                            let customName = user.displayName || userEmail.split('@')[0] || '成員';
                            try {
                                const memberSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', user.uid));
                                if (memberSnap.exists() && memberSnap.data().name) {
                                    customName = memberSnap.data().name;
                                }
                            } catch (e) {
                                console.log("讀取用戶資料失敗", e);
                            }

                            this.currentUser = {
                                id: user.uid,
                                name: customName,
                                email: user.email || '',
                                avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`
                            };
                            this.tempDisplayName = this.currentUser.name;

                            const memberRef = doc(db, 'artifacts', appId, 'public', 'data', 'members', user.uid);
                            await setDoc(memberRef, this.currentUser, { merge: true });
                            this.showToast(`歡迎回來，${this.currentUser.name}！`);
                        } else {
                            this.isLoggedIn = false;
                            this.currentUser = null;
                        }
                    });

                    // 4. Listen to Realtime Members Registry
                    const membersCol = collection(db, 'artifacts', appId, 'public', 'data', 'members');
                    onSnapshot(membersCol, (snapshot) => {
                        const cloudMembers = [];
                        snapshot.forEach(docSnap => cloudMembers.push(docSnap.data()));
                        this.members = cloudMembers;
                    });

                    // 5. Listen to Realtime Schedules Map
                    const schedulesCol = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
                    onSnapshot(schedulesCol, (snapshot) => {
                        const newMap = {};
                        snapshot.forEach(docSnap => {
                            newMap[docSnap.id] = docSnap.data();
                        });
                        this.availabilityMap = newMap;
                    });
                },

                loginWithGoogle() {
                    if (!this.isFirebaseActive) {
                        this.showToast('⚠️ 請先設定 Firebase Config');
                        return;
                    }
                    const provider = new GoogleAuthProvider();
                    signInWithPopup(auth, provider).then((result) => {
                        this.showToast(`Google 登入成功：${result.user.displayName}`);
                    }).catch(() => {
                        this.showToast('Google 登入失敗或視窗已關閉');
                    });
                },

                logout() {
                    if (this.isFirebaseActive && auth) {
                        signOut(auth).then(() => {
                            this.isLoggedIn = false;
                            this.currentUser = null;
                            this.showToast('已成功登出帳號');
                        });
                    }
                },

                async saveDisplayName() {
                    if (!this.tempDisplayName.trim() || !this.currentUser) return;
                    
                    const newName = this.tempDisplayName.trim();
                    this.currentUser.name = newName;

                    if (this.isFirebaseActive && db) {
                        try {
                            const memberRef = doc(db, 'artifacts', appId, 'public', 'data', 'members', this.currentUser.id);
                            await setDoc(memberRef, { name: newName }, { merge: true });
                        } catch (err) {
                            console.error("更新暱稱失敗:", err);
                        }
                    }

                    this.openSettingsModal = false;
                    this.showToast(`已成功修改顯示暱稱為：「${newName}」`);
                },

                async saveWhitelist() {
                    if (!this.isAdmin) return;

                    if (this.isFirebaseActive && db) {
                        try {
                            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                            await setDoc(configRef, {
                                adminEmail: this.adminEmail.trim().toLowerCase(),
                                enableWhitelist: this.enableWhitelist,
                                allowedEmails: this.allowedEmails.map(e => e.trim().toLowerCase())
                            }, { merge: true });

                            this.openWhitelistModal = false;
                            this.showToast('🔒 白名單與管理員設定已成功同步至雲端！');
                        } catch (err) {
                            console.error("儲存白名單失敗:", err);
                            this.showToast('權限不足或網路問題，儲存失敗');
                        }
                    } else {
                        this.openWhitelistModal = false;
                    }
                },

                // 🔍 成員專屬高亮模式
                toggleUserFocus(userId) {
                    if (this.focusedUserId === userId) {
                        this.focusedUserId = null;
                        this.showToast('已恢復全組總覽視角');
                    } else {
                        this.focusedUserId = userId;
                        const mem = this.members.find(m => m.id === userId);
                        const name = mem ? mem.name : '成員';
                        this.showToast(`正在切換專屬視角：查看 ${name} 的時間表`);
                    }
                },

                getFocusedMemberName() {
                    if (!this.focusedUserId) return '';
                    const mem = this.members.find(m => m.id === this.focusedUserId);
                    return mem ? mem.name : '成員';
                },

                // 🔄 4-stage cycle: Null ➔ 'free' ➔ 'maybe' ➔ 'busy' ➔ Null
                async toggleAvailability(dateKey) {
                    if (!this.isLoggedIn) {
                        this.loginWithGoogle();
                        return;
                    }
                    if (!dateKey) return;

                    if (!this.availabilityMap[dateKey]) {
                        this.availabilityMap[dateKey] = {};
                    }

                    const currentStatus = this.availabilityMap[dateKey][this.currentUser.id];
                    let nextStatus = null;

                    if (!currentStatus) {
                        nextStatus = 'free';
                        this.showToast(`已標記 ${this.formatDateTitle(dateKey)}：🟢 有空`);
                    } else if (currentStatus === 'free') {
                        nextStatus = 'maybe';
                        this.showToast(`已變更 ${this.formatDateTitle(dateKey)}：🟡 待定`);
                    } else if (currentStatus === 'maybe') {
                        nextStatus = 'busy';
                        this.showToast(`已變更 ${this.formatDateTitle(dateKey)}：🔴 沒空`);
                    } else {
                        nextStatus = null;
                        this.showToast(`已取消 ${this.formatDateTitle(dateKey)} 的標記`);
                    }

                    if (this.isFirebaseActive && db) {
                        try {
                            const dateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', dateKey);
                            const updateData = {};
                            updateData[this.currentUser.id] = nextStatus || deleteField();
                            await setDoc(dateDocRef, updateData, { merge: true });
                        } catch (err) {
                            console.error("寫入時間失敗:", err);
                        }
                    }
                },

                getUserStatus(dateKey, userId) {
                    return this.availabilityMap[dateKey] ? this.availabilityMap[dateKey][userId] : null;
                },

                getUserStatusText(dateKey, userId) {
                    const st = this.getUserStatus(dateKey, userId);
                    if (st === 'free') return '🟢 有空';
                    if (st === 'maybe') return '🟡 待定';
                    if (st === 'busy') return '🔴 沒空';
                    return '⚪ 未標記';
                },

                getAvailableCount(dateKey) {
                    if (!this.availabilityMap[dateKey]) return 0;
                    return Object.values(this.availabilityMap[dateKey]).filter(st => st === 'free').length;
                },

                getMaybeCount(dateKey) {
                    if (!this.availabilityMap[dateKey]) return 0;
                    return Object.values(this.availabilityMap[dateKey]).filter(st => st === 'maybe').length;
                },

                getBusyCount(dateKey) {
                    if (!this.availabilityMap[dateKey]) return 0;
                    return Object.values(this.availabilityMap[dateKey]).filter(st => st === 'busy').length;
                },

                getActiveUsersForDate(dateKey) {
                    if (!this.availabilityMap[dateKey]) return [];
                    const userIds = Object.keys(this.availabilityMap[dateKey]);
                    return this.members.filter(m => userIds.includes(m.id));
                },

                getUserTotalAvailableDays(userId) {
                    let count = 0;
                    const prefix = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2, '0')}`;
                    
                    Object.entries(this.availabilityMap).forEach(([dateKey, userMap]) => {
                        if (dateKey.startsWith(prefix) && userMap && userMap[userId] === 'free') {
                            count++;
                        }
                    });
                    return count;
                },

                isEveOfHoliday(dateKey) {
                    if (!dateKey) return false;
                    const dateParts = dateKey.split('-');
                    const dateObj = new Date(parseInt(dateParts[0]), parseInt(dateParts[1]) - 1, parseInt(dateParts[2]));
                    dateObj.setDate(dateObj.getDate() + 1);
                    const nextDateKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
                    return !!hkHolidays[nextDateKey];
                },

                get bestMatchingDates() {
                    const matches = [];
                    const prefix = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2, '0')}`;

                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

                    Object.keys(this.availabilityMap).forEach(dateKey => {
                        const matchMonth = (this.bestMatchMode === 'month') ? dateKey.startsWith(prefix) : (dateKey >= todayStr);

                        if (matchMonth) {
                            const freeCount = this.getAvailableCount(dateKey);
                            const maybeCount = this.getMaybeCount(dateKey);
                            
                            if (freeCount > 0 || maybeCount > 0) {
                                const parts = dateKey.split('-');
                                const dayOfWeek = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])).getDay();
                                const isFriday = (dayOfWeek === 5);
                                const isEve = this.isEveOfHoliday(dateKey);
                                const isHol = !!hkHolidays[dateKey];
                                const isCust = !!customEvents[dateKey];

                                let score = (freeCount * 2) + maybeCount;
                                if (isFriday || isEve || isHol || isCust) score += 1.5;

                                matches.push({
                                    dateKey: dateKey,
                                    score: score,
                                    freeCount: freeCount,
                                    maybeCount: maybeCount,
                                    isFriday: isFriday,
                                    isEveHoliday: isEve,
                                    holidayName: hkHolidays[dateKey] || null,
                                    customEventName: customEvents[dateKey] || null,
                                    users: this.getActiveUsersForDate(dateKey)
                                });
                            }
                        }
                    });

                    return matches.sort((a, b) => b.score - a.score || a.dateKey.localeCompare(b.dateKey));
                },

                prevMonth() {
                    if (this.currentMonth === 0) {
                        this.currentMonth = 11;
                        this.currentYear--;
                    } else {
                        this.currentMonth--;
                    }
                },

                nextMonth() {
                    if (this.currentMonth === 11) {
                        this.currentMonth = 0;
                        this.currentYear++;
                    } else {
                        this.currentMonth++;
                    }
                },

                get monthNames() {
                    return ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
                },

                get monthYearString() {
                    return `${this.currentYear}年 ${this.monthNames[this.currentMonth]}`;
                },

                get yearOptions() {
                    const baseYear = new Date().getFullYear();
                    const years = [];
                    for (let y = baseYear - 1; y <= baseYear + 3; y++) {
                        years.push(y);
                    }
                    if (!years.includes(this.currentYear)) {
                        years.push(this.currentYear);
                        years.sort((a, b) => a - b);
                    }
                    return years;
                },

                get calendarDays() {
                    const days = [];
                    const firstDayOfMonth = new Date(this.currentYear, this.currentMonth, 1).getDay();
                    const daysInMonth = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                    const daysInPrevMonth = new Date(this.currentYear, this.currentMonth, 0).getDate();

                    const today = new Date();
                    const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

                    for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                        days.push({
                            dayNum: daysInPrevMonth - i,
                            inCurrentMonth: false,
                            dateKey: null,
                            isToday: false,
                            isSunday: false,
                            holidayName: null,
                            customEventName: null,
                            isEveHoliday: false
                        });
                    }

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateKey = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const dayOfWeek = new Date(this.currentYear, this.currentMonth, d).getDay();
                        
                        days.push({
                            dayNum: d,
                            inCurrentMonth: true,
                            dateKey: dateKey,
                            isToday: dateKey === todayKey,
                            isSunday: dayOfWeek === 0,
                            holidayName: hkHolidays[dateKey] || null,
                            customEventName: customEvents[dateKey] || null,
                            isEveHoliday: this.isEveOfHoliday(dateKey)
                        });
                    }

                    const totalCells = days.length > 35 ? 42 : 35;
                    const remainingCells = totalCells - days.length;
                    for (let n = 1; n <= remainingCells; n++) {
                        days.push({
                            dayNum: n,
                            inCurrentMonth: false,
                            dateKey: null,
                            isToday: false,
                            isSunday: false,
                            holidayName: null,
                            customEventName: null,
                            isEveHoliday: false
                        });
                    }

                    return days;
                },

                getAttendanceColorClass(count) {
                    if (count >= 5) return 'text-amber-600 font-black';
                    if (count === 4) return 'text-emerald-600 font-bold';
                    if (count >= 2) return 'text-indigo-600 font-medium';
                    return 'text-slate-500 font-normal';
                },

                formatDateTitle(dateKey, showMonth = false) {
                    if (!dateKey) return '';
                    const parts = dateKey.split('-');
                    return showMonth ? `${parts[1]}月${parts[2]}日` : `${parts[1]}月${parts[2]}日`;
                },

                jumpToDateAndOpenModal(dateKey) {
                    if (!dateKey) return;
                    const parts = dateKey.split('-');
                    this.currentYear = parseInt(parts[0]);
                    this.currentMonth = parseInt(parts[1]) - 1;
                    this.openEventModal(dateKey);
                },

                openEventModal(dateKey) {
                    this.selectedDateKey = dateKey;
                    this.eventEndDate = dateKey;
                    this.eventIsMultiDay = false;
                    this.eventStatus = 'confirmed';
                    
                    if (this.confirmedEvents[dateKey]) {
                        const existing = this.confirmedEvents[dateKey];
                        this.eventTitle = existing.title || '週末燒烤';
                        this.eventIsMultiDay = !!existing.isMultiDay;
                        this.eventEndDate = existing.endDate || dateKey;
                        this.eventStatus = existing.status || 'confirmed';
                    } else {
                        this.eventTitle = '週末燒烤';
                    }
                    this.showEventModal = true;
                },

                // 🗓️ 儲存聚會（支援單日/多天旅行與正式/暫定狀態）
                async confirmEvent() {
                    if (!this.selectedDateKey) return;
                    const title = this.eventTitle.trim() || '聚會';

                    let endDate = this.selectedDateKey;
                    if (this.eventIsMultiDay && this.eventEndDate) {
                        endDate = this.eventEndDate >= this.selectedDateKey ? this.eventEndDate : this.selectedDateKey;
                    }

                    const eventId = this.selectedDateKey;
                    const eventObj = {
                        id: eventId,
                        title: title,
                        dateKey: this.selectedDateKey,
                        startDate: this.selectedDateKey,
                        endDate: endDate,
                        isMultiDay: this.eventIsMultiDay,
                        status: this.eventStatus,
                        createdByName: this.currentUser ? this.currentUser.name : '成員',
                        updatedAt: new Date().toISOString()
                    };

                    // ⚡ 強制更新物件引用，觸發 Alpine.js 即時更新頂部 Banner 渲染
                    this.confirmedEvents = {
                        ...this.confirmedEvents,
                        [eventId]: eventObj
                    };
                    this.showEventModal = false;

                    if (this.isFirebaseActive && db) {
                        try {
                            const eventRef = doc(db, 'artifacts', appId, 'public', 'data', 'events', 'confirmed');
                            const updateData = {};
                            updateData[`eventsMap.${eventId}`] = eventObj;
                            await setDoc(eventRef, updateData, { merge: true });
                        } catch (err) {
                            console.error("寫入聚會活動失敗:", err);
                        }
                    }

                    const statusText = this.eventStatus === 'confirmed' ? '✅ 正式敲定' : '⏳ 暫定';
                    this.showToast(`🗓️ 已成功儲存 (${statusText})：「${title}」！`);
                },

                // 🗓️ 取消特定日期的聚會
                async clearConfirmedEvent(targetId = null) {
                    if (!this.isAdmin) return;
                    const keyToRemove = targetId || this.selectedDateKey;
                    if (!keyToRemove) return;

                    delete this.confirmedEvents[keyToRemove];
                    this.confirmedEvents = { ...this.confirmedEvents };

                    if (this.isFirebaseActive && db) {
                        try {
                            const eventRef = doc(db, 'artifacts', appId, 'public', 'data', 'events', 'confirmed');
                            const updateData = {};
                            updateData[`eventsMap.${keyToRemove}`] = deleteField();
                            await setDoc(eventRef, updateData, { merge: true });
                        } catch (err) {
                            console.error("取消聚會失敗:", err);
                        }
                    }

                    this.showToast('已成功取消活動');
                },

                copyShareLink() {
                    const dummyUrl = window.location.href;
                    const el = document.createElement('textarea');
                    el.value = dummyUrl;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);

                    this.showToast('連結已複製至剪貼簿！發送給 5 位朋友即可直接使用');
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.visible = true;
                    setTimeout(() => {
                        this.toast.visible = false;
                    }, 3000);
                }
            };
        }

        window.timeMatcherApp = createTimeMatcherApp;

        document.addEventListener('alpine:init', () => {
            if (window.Alpine) {
                window.Alpine.data('timeMatcherApp', createTimeMatcherApp);
            }
        });
    </script>

    <!-- Load Alpine.js script AFTER function definition -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
