<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Time Matcher</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col" x-data="timeMatcherApp()" x-init="initApp()">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- App Logo & Title -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid font-bold fa-calendar-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg text-slate-900 tracking-tight leading-none">約時間啦喂</h1>
                </div>
            </div>

            <!-- Google Auth Status / User Profile Menu -->
            <div class="flex items-center space-x-3">
                <!-- Logged Out State: Show Google Login Button -->
                <template x-if="!isLoggedIn">
                    <button @click="loginWithGoogle()" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm">
                        <i class="fa-brands fa-google text-sm"></i>
                        <span>Google 帳號登入</span>
                    </button>
                </template>

                <!-- Logged In State: Show User Profile Dropdown -->
                <template x-if="isLoggedIn">
                    <div class="relative" x-data="{ openProfile: false }">
                        <button @click="openProfile = !openProfile" class="flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 p-1.5 pr-3 rounded-full transition">
                            <img :src="currentUser.avatar" class="w-8 h-8 rounded-full border-2 border-white shadow-xs" :alt="currentUser.name">
                            <div class="text-left hidden sm:block">
                                <div class="text-xs font-bold text-slate-800 flex items-center space-x-1">
                                    <span x-text="currentUser.name"></span>
                                    <template x-if="isAdmin">
                                        <span class="text-[9px] bg-amber-100 text-amber-800 font-extrabold px-1.5 py-0.2 rounded border border-amber-200">👑 管理員</span>
                                    </template>
                                </div>
                                <div class="text-[10px] text-emerald-600 font-semibold">● Google 已登入</div>
                            </div>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs ml-1"></i>
                        </button>

                        <!-- Dropdown Profile Menu -->
                        <div x-show="openProfile" @click.outside="openProfile = false" x-cloak 
                             class="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-slate-100 p-3 z-50">
                            <div class="flex items-center space-x-3 p-2 bg-slate-50 rounded-xl mb-2">
                                <img :src="currentUser.avatar" class="w-10 h-10 rounded-full">
                                <div class="overflow-hidden">
                                    <div class="text-sm font-bold text-slate-800 truncate flex items-center space-x-1">
                                        <span x-text="currentUser.name"></span>
                                        <template x-if="isAdmin">
                                            <span class="text-[9px] bg-amber-100 text-amber-800 font-bold px-1 rounded">👑</span>
                                        </template>
                                    </div>
                                    <div class="text-xs text-slate-500 truncate" x-text="currentUser.email"></div>
                                </div>
                            </div>
                            
                            <!-- Action Buttons inside profile dropdown -->
                            <div class="space-y-1 mb-2 border-b border-slate-100 pb-2">
                                <button @click="openSettingsModal = true; openProfile = false" class="w-full text-left text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 p-2 rounded-xl transition flex items-center space-x-2">
                                    <i class="fa-solid fa-user-pen text-indigo-500"></i>
                                    <span>修改個人顯示暱稱</span>
                                </button>
                                
                                <!-- Admin Only Whitelist Modal Trigger -->
                                <template x-if="isAdmin">
                                    <button @click="openWhitelistModal = true; openProfile = false" class="w-full text-left text-xs font-semibold text-slate-700 hover:bg-amber-50 hover:text-amber-700 p-2 rounded-xl transition flex items-center space-x-2">
                                        <i class="fa-solid fa-crown text-amber-500"></i>
                                        <span>管理 5 位白名單成員 (管理員)</span>
                                    </button>
                                </template>
                                <template x-if="!isAdmin">
                                    <div class="w-full text-left text-[11px] font-medium text-slate-400 p-2 rounded-xl flex items-center space-x-2 bg-slate-50">
                                        <i class="fa-solid fa-lock text-slate-400"></i>
                                        <span>白名單由管理員 (<span x-text="adminEmail" class="font-mono"></span>) 管理</span>
                                    </div>
                                </template>
                            </div>

                            <button @click="logout(); openProfile = false" class="w-full text-left text-xs font-semibold text-red-500 hover:bg-red-50 p-2 rounded-xl transition flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                <span>登出帳號</span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Calendar & Controls (8 Cols) -->
        <section class="lg:col-span-8 flex flex-col space-y-4">
            
            <!-- Calendar Navigation Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 flex items-center space-x-2">
                        <span x-text="monthYearString"></span>
                        <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full border border-indigo-100 font-semibold" x-text="members.length + ' 位成員'"></span>
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">點擊日曆切換：<span class="text-emerald-600 font-bold">🟢 有空</span> ➔ <span class="text-amber-600 font-bold">🟡 待定</span> ➔ <span class="text-slate-400">⚪ 取消</span></p>
                </div>

                <!-- Legend status indicator -->
                <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-100 text-xs">
                    <span class="flex items-center space-x-1 text-emerald-700 font-medium">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <span>有空</span>
                    </span>
                    <span class="text-slate-300">|</span>
                    <span class="flex items-center space-x-1 text-amber-700 font-medium">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <span>待定</span>
                    </span>
                </div>

                <div class="flex items-center space-x-2">
                    <button @click="prevMonth()" class="p-2.5 hover:bg-slate-100 rounded-xl text-slate-600 transition border border-slate-200">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button @click="currentMonth = new Date().getMonth(); currentYear = new Date().getFullYear();" class="px-3 py-2 hover:bg-slate-100 rounded-xl text-xs font-bold text-slate-700 transition border border-slate-200">
                        今天
                    </button>
                    <button @click="nextMonth()" class="p-2.5 hover:bg-slate-100 rounded-xl text-slate-600 transition border border-slate-200">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Calendar Grid Container -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs flex-1 flex flex-col relative">
                
                <!-- Prompt overlay if user is not logged in -->
                <template x-if="!isLoggedIn">
                    <div class="absolute inset-0 bg-white/80 backdrop-blur-[2px] z-20 rounded-2xl flex flex-col items-center justify-center p-6 text-center">
                        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-xl mb-3 shadow-md">
                            <i class="fa-brands fa-google"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-900 mb-1">請先登入 Google 帳號</h3>
                        <p class="text-xs text-slate-500 mb-4 max-w-xs">登入後即可在月曆上標記你有空的時間，並與 5 位朋友實時夾時間！</p>
                        <button @click="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-md flex items-center space-x-2">
                            <i class="fa-brands fa-google"></i>
                            <span>立即使用 Google 登入</span>
                        </button>
                    </div>
                </template>

                <!-- Day Names Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-2">
                    <div class="text-rose-500 py-1">日</div>
                    <div class="py-1">一</div>
                    <div class="py-1">二</div>
                    <div class="py-1">三</div>
                    <div class="py-1">四</div>
                    <div class="py-1">五</div>
                    <div class="text-indigo-500 py-1">六</div>
                </div>

                <!-- Calendar Days Grid -->
                <div class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr">
                    <template x-for="(dayObj, index) in calendarDays" :key="index">
                        <div 
                            x-data="{ hovered: false }"
                            @mouseenter="hovered = true"
                            @mouseleave="hovered = false"
                            :class="{
                                'bg-slate-50/50 border-transparent text-slate-300 pointer-events-none': !dayObj.inCurrentMonth,
                                'border-slate-200 hover:border-indigo-400 bg-white': dayObj.inCurrentMonth,
                                'ring-2 ring-indigo-600 ring-offset-1': dayObj.isToday && dayObj.inCurrentMonth
                            }"
                            class="relative min-h-[85px] sm:min-h-[100px] border rounded-2xl p-1.5 sm:p-2 flex flex-col justify-between transition-all duration-150 cursor-pointer group shadow-xs hover:shadow-md"
                            @click="dayObj.inCurrentMonth && toggleAvailability(dayObj.dateKey)">
                            
                            <!-- Top Date Bar -->
                            <div class="flex items-center justify-between">
                                <span 
                                    :class="{
                                        'font-extrabold text-indigo-600': dayObj.isToday,
                                        'text-slate-700 font-bold': dayObj.inCurrentMonth,
                                        'text-slate-300': !dayObj.inCurrentMonth
                                    }"
                                    class="text-xs sm:text-sm" x-text="dayObj.dayNum">
                                </span>

                                <!-- Quick Badge for Current User Status -->
                                <template x-if="dayObj.inCurrentMonth && isLoggedIn">
                                    <div>
                                        <span x-show="getUserStatus(dayObj.dateKey, currentUser.id) === 'free'" class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-md font-bold flex items-center space-x-1">
                                            <i class="fa-solid fa-check text-[9px]"></i>
                                            <span class="hidden sm:inline">我有空</span>
                                        </span>
                                        <span x-show="getUserStatus(dayObj.dateKey, currentUser.id) === 'maybe'" class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-md font-bold flex items-center space-x-1">
                                            <i class="fa-solid fa-question text-[9px]"></i>
                                            <span class="hidden sm:inline">待定</span>
                                        </span>
                                    </div>
                                </template>
                            </div>

                            <!-- Heatmap & Attendance Visualizer -->
                            <template x-if="dayObj.inCurrentMonth">
                                <div class="mt-1 space-y-1">
                                    <!-- Attendance Count Badge -->
                                    <div class="flex items-center justify-between">
                                        <div class="text-[11px] font-bold flex items-center space-x-1"
                                             :class="getAttendanceColorClass(getAvailableCount(dayObj.dateKey))">
                                            <i class="fa-solid fa-users text-[10px]"></i>
                                            <span x-text="getAvailableCount(dayObj.dateKey) + '有空' + (getMaybeCount(dayObj.dateKey) > 0 ? ' (' + getMaybeCount(dayObj.dateKey) + '待定)' : '')"></span>
                                        </div>
                                        <template x-if="getAvailableCount(dayObj.dateKey) >= 5">
                                            <span class="text-[10px] bg-amber-100 text-amber-700 font-extrabold px-1.5 py-0.5 rounded-full animate-pulse">
                                                ★ 全員
                                            </span>
                                        </template>
                                    </div>

                                    <!-- Avatars Row for Members with border color matching status -->
                                    <div class="flex items-center -space-x-1.5 overflow-hidden py-1">
                                        <template x-for="user in getActiveUsersForDate(dayObj.dateKey)" :key="user.id">
                                            <img :src="user.avatar" 
                                                 :title="user.name + (getUserStatus(dayObj.dateKey, user.id) === 'free' ? ' (有空)' : ' (待定)')" 
                                                 :class="{
                                                     'border-2 border-emerald-500 shadow-xs': getUserStatus(dayObj.dateKey, user.id) === 'free',
                                                     'border-2 border-amber-400 opacity-80': getUserStatus(dayObj.dateKey, user.id) === 'maybe'
                                                 }"
                                                 class="w-5 h-5 sm:w-6 sm:h-6 rounded-full object-cover">
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Hover Tooltip Popup showing exact status per member -->
                            <div x-show="hovered && dayObj.inCurrentMonth && members.length > 0" 
                                 x-transition:enter="transition ease-out duration-150"
                                 x-transition:enter-start="opacity-0 scale-95"
                                 x-transition:enter-end="opacity-100 scale-100"
                                 x-cloak
                                 class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-52 bg-slate-900 text-white text-xs rounded-xl p-2.5 shadow-xl z-40 pointer-events-none">
                                <div class="font-bold border-b border-slate-700 pb-1 mb-1.5 flex justify-between">
                                    <span x-text="formatDateTitle(dayObj.dateKey)"></span>
                                    <span class="text-emerald-400 font-mono" x-text="getAvailableCount(dayObj.dateKey) + '有空 / ' + getMaybeCount(dayObj.dateKey) + '待定'"></span>
                                </div>
                                <div class="space-y-1">
                                    <template x-for="member in members" :key="member.id">
                                        <div class="flex items-center justify-between text-[11px]">
                                            <div class="flex items-center space-x-1.5">
                                                <span class="w-1.5 h-1.5 rounded-full" 
                                                      :class="{
                                                          'bg-emerald-400': getUserStatus(dayObj.dateKey, member.id) === 'free',
                                                          'bg-amber-400': getUserStatus(dayObj.dateKey, member.id) === 'maybe',
                                                          'bg-slate-600': !getUserStatus(dayObj.dateKey, member.id)
                                                      }"></span>
                                                <span x-text="member.name" :class="currentUser && currentUser.id === member.id ? 'font-bold text-indigo-300' : 'text-slate-300'"></span>
                                            </div>
                                            <span x-text="getUserStatusText(dayObj.dateKey, member.id)" 
                                                  :class="{
                                                      'text-emerald-400 font-bold': getUserStatus(dayObj.dateKey, member.id) === 'free',
                                                      'text-amber-400 font-bold': getUserStatus(dayObj.dateKey, member.id) === 'maybe',
                                                      'text-slate-500': !getUserStatus(dayObj.dateKey, member.id)
                                                  }"></span>
                                        </div>
                                    </template>
                                </div>
                                <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-900"></div>
                            </div>

                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Quick Tip Banner -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 flex items-center space-x-3 text-xs text-indigo-900">
                <i class="fa-solid fa-shield-halved text-indigo-500 text-base"></i>
                <p><strong>專屬群組保護：</strong>管理員已配置白名單存取控制，保護全組數據隱私。</p>
            </div>
        </section>

        <!-- Right Column: Analytics & Best Dates (4 Cols) -->
        <section class="lg:col-span-4 flex flex-col space-y-6">

            <!-- Best Match Recommendations Panel -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-900 flex items-center space-x-2 text-base">
                        <i class="fa-solid fa-trophy text-amber-500"></i>
                        <span>最多人有空的日子</span>
                    </h3>
                    <span class="text-[10px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full border border-amber-200">最佳相容</span>
                </div>

                <!-- Best Matches List -->
                <div class="space-y-3 custom-scrollbar overflow-y-auto max-h-[380px] pr-1">
                    <template x-for="(match, idx) in bestMatchingDates" :key="match.dateKey">
                        <div class="border rounded-2xl p-3.5 transition hover:shadow-md bg-gradient-to-r"
                             :class="{
                                'border-amber-200 from-amber-50/40 via-white to-white': match.freeCount >= 5,
                                'border-emerald-200 from-emerald-50/30 via-white to-white': match.freeCount === 4,
                                'border-slate-200 from-slate-50 via-white to-white': match.freeCount < 4
                             }">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center space-x-2">
                                    <span class="w-6 h-6 rounded-lg font-black text-xs flex items-center justify-center"
                                          :class="{
                                              'bg-amber-500 text-white': idx === 0,
                                              'bg-slate-200 text-slate-700': idx > 0
                                          }" x-text="'#' + (idx + 1)"></span>
                                    <span class="font-bold text-sm text-slate-800" x-text="formatDateTitle(match.dateKey)"></span>
                                </div>
                                <div class="flex items-center space-x-1 text-xs font-black">
                                    <span class="px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-800" x-text="match.freeCount + ' 人有空'"></span>
                                    <span x-show="match.maybeCount > 0" class="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-800" x-text="match.maybeCount + ' 待定'"></span>
                                </div>
                            </div>

                            <!-- Member Avatars for this best date -->
                            <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-100">
                                <div class="flex items-center -space-x-1.5">
                                    <template x-for="user in match.users" :key="user.id">
                                        <img :src="user.avatar" :title="user.name" class="w-6 h-6 rounded-full border-2 border-white shadow-xs">
                                    </template>
                                </div>
                                <button @click="openEventModal(match.dateKey)" class="text-indigo-600 hover:text-indigo-800 font-bold text-xs flex items-center space-x-1 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg transition">
                                    <span>定為聚會日</span>
                                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    </template>

                    <template x-if="bestMatchingDates.length === 0">
                        <div class="text-center py-8 text-slate-400">
                            <i class="fa-regular fa-calendar-xmark text-3xl mb-2"></i>
                            <p class="text-xs">這個月尚未有人標記有空的日子</p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Member Status Overview -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
                <h3 class="font-bold text-slate-900 mb-3 text-sm flex items-center justify-between">
                    <span>群組成員參與狀態</span>
                    <span class="text-xs font-normal text-emerald-600 font-bold" x-text="members.length + ' 人已加入'"></span>
                </h3>

                <div class="space-y-2.5 max-h-64 overflow-y-auto custom-scrollbar pr-1">
                    <template x-for="member in members" :key="member.id">
                        <div class="flex items-center justify-between p-2 rounded-xl border border-slate-100 hover:bg-slate-50 transition">
                            <div class="flex items-center space-x-2.5">
                                <img :src="member.avatar" class="w-8 h-8 rounded-full border border-slate-200">
                                <div>
                                    <div class="text-xs font-bold text-slate-800 flex items-center space-x-1">
                                        <span x-text="member.name"></span>
                                        <template x-if="currentUser && currentUser.id === member.id">
                                            <span class="text-[9px] bg-indigo-100 text-indigo-700 px-1.5 py-0.2 rounded font-bold">你</span>
                                        </template>
                                        <template x-if="member.email && member.email.toLowerCase() === adminEmail.toLowerCase()">
                                            <span class="text-[9px] bg-amber-100 text-amber-800 border border-amber-200 px-1.5 py-0.2 rounded font-bold">👑 管理員</span>
                                        </template>
                                    </div>
                                    <div class="text-[10px] text-slate-400 truncate max-w-[120px]" x-text="member.email"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-extrabold text-indigo-600" x-text="getUserTotalAvailableDays(member.id)"></span>
                                <span class="text-[10px] text-slate-400 block">天有空</span>
                            </div>
                        </div>
                    </template>
                    
                    <template x-if="members.length === 0">
                        <p class="text-xs text-slate-400 text-center py-4">尚未有成員登入連線</p>
                    </template>
                </div>
            </div>

            <!-- Share Actions -->
            <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-2xl p-5 text-white shadow-lg shadow-indigo-100">
                <h4 class="font-bold text-sm mb-1">邀請 5 位朋友夾時間</h4>
                <p class="text-xs text-indigo-100 mb-4">發送專屬連結，讓朋友使用 Google 帳號直接登入填寫時間。</p>

    <div x-show="openSettingsModal" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">

    <div x-show="openWhitelistModal && isAdmin" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div @click.outside="openWhitelistModal = false" class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-crown"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-900">管理員控制台：5位白名單</h3>

            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 mb-4 flex items-center justify-between">

                    <span class="text-xs font-bold text-slate-800 block">開啟白名單限制</span>

            <!-- Set Admin Email -->
            <div class="mb-4 bg-amber-50/50 p-3 rounded-2xl border border-amber-100">

            <div class="space-y-2 mb-5">

                <template x-for="(email, idx) in allowedEmails" :key="idx">

    <!-- Toast Notification -->
    <div x-show="toast.visible" x-cloak 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-4"
         class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50 text-xs font-semibold">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>

    <!-- Application Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteField, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 🔑 請在此處填寫你的 Firebase Console 配置項目
        // =========================================================================
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCFFQ6v_X2O5oOco3DtXRHQyRYPbNpWPXE",
            authDomain: "fdmeet.firebaseapp.com",
            projectId: "fdmeet",
            storageBucket: "fdmeet.firebasestorage.app",
            messagingSenderId: "818872276812",
            appId: "1:818872276812:web:d1e8797f7c0f00375c21e9"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'friends-time-sync';
        let app, auth, db;
        let isFirebaseConfigured = false;

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isFirebaseConfigured = true;
            }
        } catch (e) {
            console.warn("Firebase 初始化提示：未接駁真實 API Key", e);
        }

        function createTimeMatcherApp() {
            return {
                isFirebaseActive: isFirebaseConfigured,
                isLoggedIn: false,
                currentUser: null,
                
                members: [], // Real members from Firestore
                
                currentMonth: new Date().getMonth(),
                currentYear: new Date().getFullYear(),
                
                // Firestore availability map: { "2026-09-15": { "uid123": "free", "uid456": "maybe" } }
                availabilityMap: {},

                showEventModal: false,
                openSettingsModal: false,
                openWhitelistModal: false,
                tempDisplayName: '',
                selectedDateKey: '',
                eventTitle: '週末聚會',
                toast: { visible: false, message: '' },

                // Admin & Whitelist Control
                adminEmail: '',
                enableWhitelist: true,
                allowedEmails: ['', '', '', '', ''],

                // Admin Authority Check
                get isAdmin() {
                    if (!this.currentUser || !this.currentUser.email) return false;
                    if (!this.adminEmail) return true; // If no admin set, default to creator
                    return this.currentUser.email.toLowerCase() === this.adminEmail.toLowerCase();
                },

                initApp() {
                    if (this.isFirebaseActive && auth && db) {
                        this.setupFirebaseListeners();
                    } else {
                        // Demo mode if API keys aren't set
                        console.log("App loaded in offline mode.");
                    }
                },

                setupFirebaseListeners() {
                    
                    // 1. Sync Whitelist & Admin Settings from Firestore
                    const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                    onSnapshot(configRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            this.adminEmail = data.adminEmail || '';
                            this.enableWhitelist = data.enableWhitelist !== undefined ? data.enableWhitelist : true;
                            this.allowedEmails = data.allowedEmails || ['', '', '', '', ''];
                        }
                    });

                    // 2. Auth State Changed Listener
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            const userEmail = (user.email || '').toLowerCase();

                            // Ensure Admin Email is set to first user if empty
                            if (!this.adminEmail && userEmail) {
                                this.adminEmail = userEmail;
                                await setDoc(configRef, {
                                    adminEmail: userEmail,
                                    enableWhitelist: true,
                                    allowedEmails: [userEmail, '', '', '', '']
                                }, { merge: true });
                            }

                            // Whitelist Enforcement
                            if (this.enableWhitelist) {
                                const cleanAllowed = this.allowedEmails.map(e => e.trim().toLowerCase()).filter(e => e !== '');
                                const isAllowed = cleanAllowed.length === 0 || cleanAllowed.includes(userEmail);
                                
                                if (!isAllowed) {
                                    this.showToast(`⛔ 存取拒絕：${userEmail} 非授權成員`);
                                    await signOut(auth);
                                    this.isLoggedIn = false;
                                    this.currentUser = null;
                                    return;
                                }
                            }

                            this.isLoggedIn = true;
                            
                            // Check custom display name in Firestore
                            let customName = user.displayName || userEmail.split('@')[0] || '成員';
                            try {
                                const memberSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', user.uid));
                                if (memberSnap.exists() && memberSnap.data().name) {
                                    customName = memberSnap.data().name;
                                }
                            } catch (e) {
                                console.log("讀取用戶資料失敗", e);
                            }

                            this.currentUser = {
                                id: user.uid,
                                name: customName,
                                email: user.email || '',
                                avatar: user.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.uid}`
                            };
                            this.tempDisplayName = this.currentUser.name;

                            // Register/Update current user in Firestore members registry
                            const memberRef = doc(db, 'artifacts', appId, 'public', 'data', 'members', user.uid);
                            await setDoc(memberRef, this.currentUser, { merge: true });
                            this.showToast(`歡迎回來，${this.currentUser.name}！`);
                        } else {
                            this.isLoggedIn = false;
                            this.currentUser = null;
                        }
                    });

                    // 3. Realtime Sync Members List
                    const membersCol = collection(db, 'artifacts', appId, 'public', 'data', 'members');
                    onSnapshot(membersCol, (snapshot) => {
                        const cloudMembers = [];
                        snapshot.forEach(docSnap => cloudMembers.push(docSnap.data()));
                        this.members = cloudMembers;
                    }, (err) => console.error("Firestore 成員同步失敗:", err));

                    // 4. Realtime Sync Calendar Schedule
                    const schedulesCol = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
                    onSnapshot(schedulesCol, (snapshot) => {
                        const newMap = {};
                        snapshot.forEach(docSnap => {
                            newMap[docSnap.id] = docSnap.data();
                        });
                        this.availabilityMap = newMap;
                    }, (err) => console.error("Firestore 時間同步失敗:", err));
                },

                // Google Authentication
                loginWithGoogle() {
                    if (!this.isFirebaseActive) {
                        this.showToast('⚠️ 請先設定 Firebase Config 即可開啟 Google 登入功能');
                        return;
                    }
                    const provider = new GoogleAuthProvider();
                    signInWithPopup(auth, provider).then((result) => {
                        this.showToast(`Google 登入成功：${result.user.displayName}`);
                    }).catch((error) => {
                        console.error("Login Error:", error);
                        this.showToast('Google 登入失敗或視窗已關閉');
                    });
                },

                logout() {
                    if (this.isFirebaseActive && auth) {
                        signOut(auth).then(() => {
                            this.isLoggedIn = false;
                            this.currentUser = null;
                            this.showToast('已成功登出帳號');
                        });
                    }
                },

                async saveDisplayName() {
                    if (!this.tempDisplayName.trim() || !this.currentUser) return;
                    
                    const newName = this.tempDisplayName.trim();
                    this.currentUser.name = newName;

                    if (this.isFirebaseActive && db) {
                        try {
                            const memberRef = doc(db, 'artifacts', appId, 'public', 'data', 'members', this.currentUser.id);
                            await setDoc(memberRef, { name: newName }, { merge: true });
                        } catch (err) {
                            console.error("更新暱稱失敗:", err);
                        }
                    }

                    this.openSettingsModal = false;
                    this.showToast(`已成功修改顯示暱稱為：「${newName}」`);
                },

                // Admin Whitelist Management
                async saveWhitelist() {
                    if (!this.isAdmin) return;

                    if (this.isFirebaseActive && db) {
                        try {
                            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                            await setDoc(configRef, {
                                adminEmail: this.adminEmail.trim().toLowerCase(),
                                enableWhitelist: this.enableWhitelist,
                                allowedEmails: this.allowedEmails.map(e => e.trim().toLowerCase())
                            }, { merge: true });

                            this.openWhitelistModal = false;
                            this.showToast('🔒 管理員設定與白名單已成功同步至雲端！');
                        } catch (err) {
                            console.error("儲存白名單失敗:", err);
                            this.showToast('權限不足或網路問題，儲存失敗');
                        }
                    } else {
                        this.openWhitelistModal = false;
                    }
                },

                // Three-stage Availability Toggle: None -> free (🟢) -> maybe (🟡) -> None
                async toggleAvailability(dateKey) {
                    if (!this.isLoggedIn) {
                        this.loginWithGoogle();
                        return;
                    }
                    if (!dateKey) return;

                    if (!this.availabilityMap[dateKey]) {
                        this.availabilityMap[dateKey] = {};
                    }

                    const currentStatus = this.availabilityMap[dateKey][this.currentUser.id];
                    let nextStatus = null;

                    if (!currentStatus) {
                        nextStatus = 'free';
                        this.showToast(`已標記 ${this.formatDateTitle(dateKey)}：🟢 有空`);
                    } else if (currentStatus === 'free') {
                        nextStatus = 'maybe';
                        this.showToast(`已變更 ${this.formatDateTitle(dateKey)}：🟡 待定`);
                    } else {
                        nextStatus = null;
                        this.showToast(`已取消 ${this.formatDateTitle(dateKey)} 的標記`);
                    }

                    if (this.isFirebaseActive && db) {
                        try {
                            const dateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', dateKey);
                            const updateData = {};
                            updateData[this.currentUser.id] = nextStatus || deleteField();
                            await setDoc(dateDocRef, updateData, { merge: true });
                        } catch (err) {
                            console.error("寫入時間失敗:", err);
                        }
                    }
                },

                getUserStatus(dateKey, userId) {
                    return this.availabilityMap[dateKey] ? this.availabilityMap[dateKey][userId] : null;
                },

                getUserStatusText(dateKey, userId) {
                    const st = this.getUserStatus(dateKey, userId);
                    if (st === 'free') return '有空';
                    if (st === 'maybe') return '待定';
                    return '沒空';
                },

                getAvailableCount(dateKey) {
                    if (!this.availabilityMap[dateKey]) return 0;
                    return Object.values(this.availabilityMap[dateKey]).filter(st => st === 'free').length;
                },

                getMaybeCount(dateKey) {
                    if (!this.availabilityMap[dateKey]) return 0;
                    return Object.values(this.availabilityMap[dateKey]).filter(st => st === 'maybe').length;
                },

                getActiveUsersForDate(dateKey) {
                    if (!this.availabilityMap[dateKey]) return [];
                    const userIds = Object.keys(this.availabilityMap[dateKey]);
                    return this.members.filter(m => userIds.includes(m.id));
                },

                getUserTotalAvailableDays(userId) {
                    let count = 0;
                    Object.values(this.availabilityMap).forEach(userMap => {
                        if (userMap[userId] === 'free') count++;
                    });
                    return count;
                },

                get bestMatchingDates() {
                    const matches = [];
                    const prefix = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2, '0')}`;

                    Object.keys(this.availabilityMap).forEach(dateKey => {
                        if (dateKey.startsWith(prefix)) {
                            const freeCount = this.getAvailableCount(dateKey);
                            const maybeCount = this.getMaybeCount(dateKey);
                            
                            if (freeCount > 0 || maybeCount > 0) {
                                const score = (freeCount * 2) + maybeCount;
                                matches.push({
                                    dateKey: dateKey,
                                    score: score,
                                    freeCount: freeCount,
                                    maybeCount: maybeCount,
                                    users: this.getActiveUsersForDate(dateKey)
                                });
                            }
                        }
                    });

                    return matches.sort((a, b) => b.score - a.score || a.dateKey.localeCompare(b.dateKey));
                },

                prevMonth() {
                    if (this.currentMonth === 0) {
                        this.currentMonth = 11;
                        this.currentYear--;
                    } else {
                        this.currentMonth--;
                    }
                },

                nextMonth() {
                    if (this.currentMonth === 11) {
                        this.currentMonth = 0;
                        this.currentYear++;
                    } else {
                        this.currentMonth++;
                    }
                },

                get monthYearString() {
                    const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
                    return `${this.currentYear}年 ${monthNames[this.currentMonth]}`;
                },

                get calendarDays() {
                    const days = [];
                    const firstDayOfMonth = new Date(this.currentYear, this.currentMonth, 1).getDay();
                    const daysInMonth = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                    const daysInPrevMonth = new Date(this.currentYear, this.currentMonth, 0).getDate();

                    const today = new Date();
                    const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

                    for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                        days.push({
                            dayNum: daysInPrevMonth - i,
                            inCurrentMonth: false,
                            dateKey: null,
                            isToday: false
                        });
                    }

                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateKey = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        days.push({
                            dayNum: d,
                            inCurrentMonth: true,
                            dateKey: dateKey,
                            isToday: dateKey === todayKey
                        });
                    }

                    const totalCells = days.length > 35 ? 42 : 35;
                    const remainingCells = totalCells - days.length;
                    for (let n = 1; n <= remainingCells; n++) {
                        days.push({
                            dayNum: n,
                            inCurrentMonth: false,
                            dateKey: null,
                            isToday: false
                        });
                    }

                    return days;
                },

                getAttendanceColorClass(count) {
                    if (count >= 5) return 'text-amber-600 font-black';
                    if (count === 4) return 'text-emerald-600 font-bold';
                    if (count >= 2) return 'text-indigo-600 font-medium';
                    return 'text-slate-500 font-normal';
                },

                formatDateTitle(dateKey) {
                    if (!dateKey) return '';
                    const parts = dateKey.split('-');
                    return `${parts[1]}月${parts[2]}日`;
                },

                openEventModal(dateKey) {
                    this.selectedDateKey = dateKey;
                    this.showEventModal = true;
                },

                confirmEvent() {
                    this.showEventModal = false;
                    this.showToast(`🎉 已為 ${this.formatDateTitle(this.selectedDateKey)} 發起「${this.eventTitle}」聚會！`);
                },

                copyShareLink() {
                    const dummyUrl = window.location.href;
                    const el = document.createElement('textarea');
                    el.value = dummyUrl;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);

                    this.showToast('連結已複製至剪貼簿！發送給 5 位朋友即可直接使用');
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.visible = true;
                    setTimeout(() => {
                        this.toast.visible = false;
                    }, 3000);
                }
            };
        }

        // Attach to window so Alpine can evaluate x-data="timeMatcherApp()"
        window.timeMatcherApp = createTimeMatcherApp;

        // Register with Alpine when alpine initialized
        document.addEventListener('alpine:init', () => {
            if (window.Alpine) {
                window.Alpine.data('timeMatcherApp', createTimeMatcherApp);
            }
        });
    </script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
